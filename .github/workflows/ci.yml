# NFR-03 / NFR-04: quality gates on Windows, Linux and macOS.
# From M3 on, a determinism job compares the built sample file across the three platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # kapu-gui (M10, D115): Tauri needs the WebKitGTK webview and its headers on Linux.
      # The packages are cached: the runner's apt mirror can be very slow (D119).
      - name: Linux webview libraries (cache)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-webkit2gtk-4.1-${{ runner.os }}-v1
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
          sudo chown -R "$USER" ~/apt-cache
      # rustup reads rust-toolchain.toml and installs the pinned version.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo-deny (licences, sources, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    # The action reports through a check run; the default token is read-only.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # NFR-03/5: short fuzz run of every target on each push.
  # The one-hour-per-target gate runs before a release (scripts/fuzz.ps1 -Seconds 3600).
  fuzz:
    name: fuzz smoke (Linux, 30 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install --locked cargo-fuzz
      - name: run every target
        run: |
          for t in header sections docs catalog validate reader; do
            mkdir -p "fuzz/corpus/$t"
            cp tests/vectors/*.kapu "fuzz/corpus/$t/"
            cargo +nightly fuzz run "$t" "fuzz/corpus/$t" --debug-assertions -- -max_total_time=30
          done
