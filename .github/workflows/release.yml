# M9: portable packages for Windows, Linux and macOS (NFR-06), on a version tag.
# Each package: kapu, kapu-mcp, kapu-gui, models/potion-multilingual-128M-i8
# (downloaded from Hugging Face and quantized with tools/quantize.py), the demo
# file examples/kapu-spec.kapu, licences, README, spec.
# The packages are attached to a draft release; publishing it is a manual step.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            exe: .exe
          - os: ubuntu-latest
            target: linux-x64
            exe: ""
          - os: macos-latest
            target: macos-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    # D142: the release binaries come from the toolchain CI tests with.
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@v4
      # The packages are cached: the runner's apt mirror can be very slow (D119).
      - name: Linux webview libraries (cache)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-webkit2gtk-4.1-${{ runner.os }}-v1
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-cache" libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
          sudo chown -R "$USER" ~/apt-cache
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p kapu-cli -p kapu-mcp -p kapu-gui --bins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: model (download, verify, quantize)
        shell: bash
        run: |
          set -euo pipefail
          m=models/potion-multilingual-128M
          mkdir -p "$m"
          for f in config.json README.md tokenizer.json model.safetensors; do
            curl -sSfL -o "$m/$f" "https://huggingface.co/minishlab/potion-multilingual-128M/resolve/main/$f"
          done
          python -c "import hashlib,sys; h=hashlib.sha256(open('$m/model.safetensors','rb').read()).hexdigest(); sys.exit(h!='14b5eb39cb4ce5666da8ad1f3dc6be4346e9b2d601c073302fa0a31bf7943397')"
          pip install numpy
          python tools/quantize.py "$m"
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          name="kapu-$v-${{ matrix.target }}"
          mkdir -p "dist/$name/models/potion-multilingual-128M-i8"
          cp "target/release/kapu${{ matrix.exe }}" "target/release/kapu-mcp${{ matrix.exe }}" "target/release/kapu-gui${{ matrix.exe }}" "dist/$name/"
          mkdir -p "dist/$name/examples" && cp examples/kapu-spec.kapu examples/kapu-docs.kapu "dist/$name/examples/"
          cp models/potion-multilingual-128M-i8/* "dist/$name/models/potion-multilingual-128M-i8/"
          cp LICENSE README.md SPEC-KAPU.md SPEC-KAPU.hu.md THIRD-PARTY.md "dist/$name/"
          printf 'SPEC-KAPU.md, SPEC-KAPU.hu.md: CC BY 4.0, https://creativecommons.org/licenses/by/4.0/\n' > "dist/$name/LICENSE-SPEC.txt"
          "dist/$name/kapu${{ matrix.exe }}" new "dist/smoke.kapu"
          "dist/$name/kapu${{ matrix.exe }}" validate --full "dist/smoke.kapu"
          cd dist && if [ "${{ matrix.exe }}" = ".exe" ]; then f="$name.zip"; 7z a "$f" "$name" >/dev/null; else f="$name.tar.gz"; tar czf "$f" "$name"; fi
          # install.sh and install.ps1 check the archive against this
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
