<style>
:root{
  --bg:#f7f7f5;--panel:#ffffff;--fg:#1d1d1b;--muted:#5f5f5a;--line:#e3e2dd;--accent:#c4431d;
  --c1:#c4431d;--c2:#2f6db5;--c3:#7a8b2f;--c4:#8a5cb8;--c5:#b88a1f;
  --grid:#ecebe6;--axis:#bdbcb5;--radius:10px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161614;--panel:#1f1f1c;--fg:#ecebe6;--muted:#a3a29b;--line:#34332f;--accent:#ee7a52;
    --c1:#ee7a52;--c2:#6fa3e8;--c3:#a9bd55;--c4:#b590e0;--c5:#e0b54a;--grid:#2a2a27;--axis:#4a4944;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161614;--panel:#1f1f1c;--fg:#ecebe6;--muted:#a3a29b;--line:#34332f;--accent:#ee7a52;
  --c1:#ee7a52;--c2:#6fa3e8;--c3:#a9bd55;--c4:#b590e0;--c5:#e0b54a;--grid:#2a2a27;--axis:#4a4944;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:72rem;margin:0 auto;padding:32px 16px 64px;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:400;font-size:2.2rem;margin:0;line-height:1.15}
h1 span{color:var(--accent)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:44px;height:44px;flex:none}
h2{font-size:1.3rem;font-weight:600;margin:0}
h3{font-size:1.02rem;font-weight:600;margin:0}
.lead{font-size:1.06rem;max-width:72ch;margin:0}
.meta,.note,.card>p{color:var(--muted);margin:0;max-width:78ch}
.meta{font-size:.85rem}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
section{display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:4px}
.tile .lbl,.tile .sub{font-size:.82rem;color:var(--muted)}
.tile .big{font-family:var(--serif);font-size:1.9rem;font-variant-numeric:tabular-nums}
.tile.dim .big{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card>p{font-size:.85rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
td.better{color:var(--c3);font-weight:600}
td.worse{color:var(--c1);font-weight:600}
td.long{white-space:normal;min-width:16rem;text-align:left}
th.long{text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chart{position:relative;min-height:260px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:6px 10px;font-size:.8rem;z-index:2;min-width:10rem}
.tip .tt{color:var(--muted);margin-bottom:2px}
.tip .tl{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.tip .tl i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tip .tl b{margin-left:auto;font-weight:600}
.tip[hidden]{display:none}
ul{margin:0;padding-left:1.2rem;color:var(--muted);max-width:80ch}
li{margin:4px 0}
footer{font-size:.85rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
a{color:var(--accent)}
@media print{
  @page{size:A4 landscape;margin:12mm}
  :root{color-scheme:light}
  body{font-size:11px;background:#fff}
  .wrap{max-width:none;padding:0;gap:18px}
  .lang,.tip{display:none}
  .tablewrap{overflow:visible}
  table{font-size:9px}
  th{white-space:normal}
  th,td{padding:3px 5px}
  .card,.tile,section>h2{break-inside:avoid}
  section{break-inside:auto}
  h2{break-after:avoid}
  .chart{min-height:0}
}
</style>
</head>

const SERIES_COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5"];
const color = i => getComputedStyle(document.documentElement).getPropertyValue(SERIES_COLORS[i]).trim();
let LANG = "en";

function locale() {
  return LANG === "hu"
    ? d3.formatLocale({ decimal: ",", thousands: " ", grouping: [3], currency: ["", ""] })
    : d3.formatLocale({ decimal: ".", thousands: ",", grouping: [3], currency: ["", ""] });
}
const t = k => I18N[LANG][k] ?? I18N.en[k] ?? k;
function fill(text, vars) { return text.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ""); }

function fmt(field, v) {
  const L = locale();
  if (v == null || v === "") return "—";
  if (typeof v === "string") return t(v) || v;
  if (["helpfulness"].includes(field)) return L.format(",.2f")(v);
  if (["r5", "r10", "mrr"].includes(field) || (typeof v === "number" && v < 1 && v > 0 && field === "value")) return L.format(".3f")(v);
  if (["peak_gb", "mb"].includes(field)) return L.format(",.2f")(v);
  if (field === "pct1") return L.format(".1%")(v);
  if (field === "pct0") return L.format(".0%")(v);
  if (Number.isInteger(v)) return L.format(",d")(v);
  return L.format(",.1f")(v);
}

function table(id, cols, rows) {
  const el = document.getElementById(id);
  el.innerHTML = "";
  const head = el.createTHead().insertRow();
  for (const c of cols) { const th = document.createElement("th"); th.textContent = t(c.label); if (c.long) th.className = "long"; head.appendChild(th); }
  const body = el.createTBody();
  for (const r of rows) {
    const tr = body.insertRow();
    for (const c of cols) {
      const td = tr.insertCell();
      const v = c.get ? c.get(r) : r[c.key];
      td.textContent = c.raw ? v : fmt(c.fmt || c.key, v);
      if (c.better && c.better(r)) td.classList.add("better");
      if (c.worse && c.worse(r)) td.classList.add("worse");
      if (c.long) td.classList.add("long");
    }
  }
}

function legend(id, series) {
  const el = document.getElementById(id);
  el.innerHTML = "";
  series.forEach((s, i) => {
    const span = document.createElement("span");
    const dot = document.createElement("i");
    dot.style.background = color(s.color ?? i);
    span.append(dot, document.createTextNode(s.label));
    el.appendChild(span);
  });
}

function tipFor(el) {
  let tip = el.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; el.appendChild(tip); }
  return tip;
}
function showTip(el, ev, title, lines) {
  const tip = tipFor(el);
  tip.innerHTML = "";
  const head = document.createElement("div"); head.className = "tt"; head.textContent = title; tip.appendChild(head);
  for (const l of lines) {
    const row = document.createElement("div"); row.className = "tl";
    const dot = document.createElement("i"); dot.style.background = l.color;
    const b = document.createElement("b"); b.textContent = l.value;
    row.append(dot, document.createTextNode(l.label), b);
    tip.appendChild(row);
  }
  tip.hidden = false;
  const box = el.getBoundingClientRect();
  let x = ev.clientX - box.left + 12, y = ev.clientY - box.top - tip.offsetHeight - 8;
  if (x + tip.offsetWidth > box.width) x = Math.max(0, ev.clientX - box.left - tip.offsetWidth - 12);
  if (y < 0) y = ev.clientY - box.top + 12;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = el => { const tip = el.querySelector(".tip"); if (tip) tip.hidden = true; };

function axis(svg, y, ticks, f, left, right) {
  svg.append("g").selectAll("line").data(ticks).join("line")
    .attr("x1", left).attr("x2", right).attr("y1", d => y(d)).attr("y2", d => y(d)).attr("stroke", "var(--grid)");
  svg.append("g").selectAll("text").data(ticks).join("text")
    .attr("x", left - 6).attr("y", d => y(d)).attr("dy", "0.32em").attr("text-anchor", "end")
    .attr("fill", "var(--muted)").attr("font-size", 11).text(f);
}
const tickWidth = (ticks, f) => d3.max(ticks, v => String(f(v)).length) * 6.6 + 10;

function grouped(el, groups, series, f) {
  el.innerHTML = "";
  const W = Math.max(280, el.clientWidth), H = 260;
  const ymax = d3.max(groups, g => d3.max(series, s => g.values[s.field])) || 1;
  const nice = d3.scaleLinear().domain([0, ymax]).nice(5);
  const ticks = nice.ticks(5);
  const m = { t: 10, r: 8, b: 30, l: tickWidth(ticks, f) };
  const y = d3.scaleLinear(nice.domain(), [H - m.b, m.t]);
  const x0 = d3.scaleBand(groups.map(g => g.key), [m.l, W - m.r]).paddingInner(0.22).paddingOuter(0.06);
  const x1 = d3.scaleBand(series.map(s => s.field), [0, x0.bandwidth()]).padding(0.1);
  const svg = d3.select(el).append("svg").attr("width", "100%").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img");
  axis(svg, y, ticks, f, m.l, W - m.r);
  svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(0)).attr("y2", y(0)).attr("stroke", "var(--axis)");
  svg.append("g").selectAll("text").data(groups).join("text")
    .attr("x", g => x0(g.key) + x0.bandwidth() / 2).attr("y", H - m.b + 18).attr("text-anchor", "middle")
    .attr("fill", "var(--muted)").attr("font-size", 11).text(g => g.label);
  const gg = svg.append("g").selectAll("g").data(groups).join("g").attr("transform", g => `translate(${x0(g.key)},0)`);
  gg.append("rect").attr("y", m.t).attr("width", x0.bandwidth()).attr("height", H - m.b - m.t).attr("fill", "transparent")
    .on("mousemove", (ev, g) => showTip(el, ev, g.title, series.map((s, i) => ({ color: color(i), label: s.label, value: f(g.values[s.field]) }))))
    .on("mouseleave", () => hideTip(el));
  gg.selectAll("rect.bar").data(g => series.map((s, i) => ({ s, i, v: g.values[s.field] }))).join("rect")
    .attr("class", "bar").attr("pointer-events", "none")
    .attr("x", d => x1(d.s.field)).attr("width", x1.bandwidth())
    .attr("y", d => y(d.v)).attr("height", d => Math.max(0, y(0) - y(d.v)))
    .attr("rx", Math.min(3, x1.bandwidth() / 2)).attr("fill", d => color(d.i));
}

function stacked(el, rows, series, f) {
  el.innerHTML = "";
  const W = Math.max(280, el.clientWidth), H = 260;
  const data = rows.map(r => Object.assign({ key: r.request, topic: r["topic_" + LANG] }, ...series.map(s => ({ [s.field]: +r[s.field] || 0 }))));
  const st = d3.stack().keys(series.map(s => s.field))(data);
  const ymax = d3.max(data, d => d3.sum(series, s => d[s.field])) || 1;
  const nice = d3.scaleLinear().domain([0, ymax]).nice(5);
  const ticks = nice.ticks(5);
  const m = { t: 10, r: 8, b: 30, l: tickWidth(ticks, f) };
  const y = d3.scaleLinear(nice.domain(), [H - m.b, m.t]);
  const x = d3.scaleBand(data.map(d => d.key), [m.l, W - m.r]).padding(0.28);
  const svg = d3.select(el).append("svg").attr("width", "100%").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img");
  axis(svg, y, ticks, f, m.l, W - m.r);
  svg.append("g").selectAll("g").data(st).join("g").attr("fill", (s, i) => color(series[i].color))
    .selectAll("rect").data(s => s).join("rect")
    .attr("x", d => x(d.data.key)).attr("width", x.bandwidth())
    .attr("y", d => y(d[1])).attr("height", d => Math.max(0, y(d[0]) - y(d[1])));
  svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(0)).attr("y2", y(0)).attr("stroke", "var(--axis)");
  svg.append("g").selectAll("text").data(data).join("text")
    .attr("x", d => x(d.key) + x.bandwidth() / 2).attr("y", H - m.b + 18).attr("text-anchor", "middle")
    .attr("fill", "var(--muted)").attr("font-size", 11).text(d => d.key);
  svg.append("g").selectAll("rect").data(data).join("rect")
    .attr("x", d => x(d.key) - x.step() * x.paddingInner() / 2).attr("width", x.step())
    .attr("y", m.t).attr("height", H - m.b - m.t).attr("fill", "transparent")
    .on("mousemove", (ev, d) => showTip(el, ev, `${d.key}: ${d.topic}`, series.map(s => ({ color: color(s.color), label: s.label, value: f(d[s.field]) }))))
    .on("mouseleave", () => hideTip(el));
}

    const rows = v.retrieval.filter(r => r.set === s);
    return { key: s, label: setName(s), title: `${setName(s)}: ${v.sets[s].test} ${t("q")}, recall@10`,
      values: Object.fromEntries(cfgs.map(c => [c, (rows.find(r => r.config === c) || {}).r10 ?? 0])) };
  }), series, L.format(".2f"));
  table("tb-v2ret", [
    { label: "col_set", get: r => setName(r.set), raw: true }, { label: "col_n", key: "n" },
    { label: "v2c_cfg", get: r => t("v2cfg_" + r.config), raw: true },
    { label: "v2c_r1", get: r => r3(r.r1), raw: true }, { label: "col_r10", get: r => r3(r.r10), raw: true },
    { label: "v2c_r100", get: r => r3(r.r100), raw: true }, { label: "col_mrr", get: r => r3(r.mrr), raw: true },
    { label: "v2c_ndcg", get: r => r3(r.ndcg), raw: true }
  ], v.retrieval);
  table("tb-v2err", [
    { label: "col_set", get: r => setName(r.set), raw: true }, { label: "v2c_cfg", get: r => t("v2cfg_" + r.config), raw: true },
    { label: "v2c_miss", key: "misses" }, { label: "v2e_dup", key: "duplication" }, { label: "v2e_fus", key: "fusion" },
    { label: "v2e_res", key: "rescore" }, { label: "v2e_rank", key: "ranking" }, { label: "v2e_voc", key: "vocabulary" },
    { label: "v2e_merge", get: r => r["merge (room hit, door missed)"], raw: true }
  ], v.errors);
  table("tb-v2ask", [
    { label: "col_set", get: r => setName(r.set), raw: true }, { label: "v2c_mode", get: r => t("v2mode_" + r.mode), raw: true, long: true },
    { label: "v2c_answered", get: r => pct(r.answered), raw: true }, { label: "v2c_tokens", key: "tokens" },
    { label: "v2c_wasted", key: "wasted" }, { label: "v2c_hits", get: r => L.format(",.1f")(r.hits), raw: true }
  ], v.ask);
  table("tb-v2grp", [
    { label: "col_set", get: r => setName(r.set), raw: true }, { label: "v2c_rooms", key: "rooms" },
    { label: "v2c_groups", get: r => `${r.groups} / ${r.truth}`, raw: true },
    { label: "v2c_ari", get: r => r3(r.file_ari), raw: true }, { label: "v2c_nmi", get: r => `${r3(r.file_nmi)} (${r3(r.random_nmi)})`, raw: true },
    { label: "v2c_km", get: r => r3(r.kmeans_ari), raw: true }, { label: "v2c_sim", get: r => r3(r.sim_ari), raw: true },
    { label: "v2c_term", get: r => r3(r.term_ari), raw: true }, { label: "v2c_big", get: r => `${int(r.largest_rooms)} / ${int(r.largest_tokens)}`, raw: true }
  ], v.groups);
  const nb = v.neighbours;
  const vars = { later: nb.later, followed: nb.followed, rate: pct(nb.rate || 0), tpd: int(Math.round(nb.tokens_per_door || 0)),
    sterm: nb.shown_term, fterm: nb.followed_term, ssim: nb.shown_sim, fsim: nb.followed_sim, slink: nb.shown_link, flink: nb.followed_link };
  const ul = document.getElementById("v2-findings");
  ul.innerHTML = "";
  for (const line of t("v2_findings")) { const li = document.createElement("li"); li.textContent = fill(line, vars); ul.appendChild(li); }
}

const SYMBOL = { le: "≤", ge: "≥", lt: "<" };
function renderV12(L, int) {
  const v = DATA.v12;
  document.getElementById("v12").hidden = !v;
  if (!v) return;
  document.getElementById("v12-note").textContent = fill(t("v12_note"), {
    date: v.date, version: v.version, rescore: int(v.rescore), en: v.en_questions, hu: v.hu_questions
  });
  const value = (kind, x) => kind === "tokens" ? int(x) : kind === "pct" ? L.format(".1~%")(x)
    : kind === "ms" ? L.format(",.1~f")(x) + " ms" : L.format(".2f")(x);
  table("tb-req", [
    { label: "col_id", key: "id", raw: true },
    { label: "col_req", get: r => t("req_" + r.id), raw: true, long: true },
    { label: "col_target", get: r => SYMBOL[r.op] + " " + value(r.kind, r.limit), raw: true },
    { label: "col_measured", get: r => value(r.kind, r.value), raw: true },
    { label: "col_met", get: r => t(r.met ? "met_yes" : "met_no"), raw: true, better: r => r.met, worse: r => !r.met }
  ], v.requirements);
  table("tb-v12", [
    { label: "c_corpus", get: r => t("corp_" + r.corpus), raw: true },
    { label: "c_mb11", key: "mb_v11", fmt: "mb" }, { label: "c_mb12", key: "mb_v12", fmt: "mb" },
    { label: "c_growth", key: "growth", fmt: "pct1", worse: r => r.growth > 0.03 },
    { label: "c_sms", key: "search_ms" }, { label: "c_oms", key: "open_ms" },
    { label: "c_fmap", key: "map_first" }, { label: "c_nmap", key: "map_next" },
    { label: "c_stok", key: "search_tokens" }, { label: "c_smax", key: "search_max" },
    { label: "c_ask", key: "ask_tokens" }, { label: "c_answered", key: "answered", fmt: "pct0" }
  ], v.corpora);
  table("tb-v12r", [
    { label: "col_set", get: r => t("set_" + r.set), raw: true }, { label: "col_n", key: "n" },
    { label: "col_v11f", key: "v11", fmt: "r10" }, { label: "col_signs", key: "signs", fmt: "r10" },
    { label: "col_v12r", key: "v12", fmt: "r10", better: r => r.v11 != null && r.v12 > r.v11 }
  ], v.retrieval);
  const ul = document.getElementById("open-list");
  ul.innerHTML = "";
  for (const line of t("open_items")) { const li = document.createElement("li"); li.textContent = line; ul.appendChild(li); }
}

function setLang(lang) {
  LANG = lang === "hu" ? "hu" : "en";
  try { localStorage.setItem("kapu-results-lang", LANG); } catch (e) { /* storage may be blocked */ }
  render();
}

let saved = null;
try { saved = localStorage.getItem("kapu-results-lang"); } catch (e) { saved = null; }
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
const asked = new URLSearchParams(location.search).get("lang");
setLang(asked || saved || ((navigator.language || "").toLowerCase().startsWith("hu") ? "hu" : "en"));
</script>
</body>
</html>
