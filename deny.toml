# cargo-deny configuration (NFR-03/4): licence allow-list and source restrictions.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # D94: `paste` is an unmaintained proc-macro pulled in by `tokenizers` 0.22.
    # Compile-time only, no runtime code; revisit when `tokenizers` drops it.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro of tokenizers, no runtime code (D94)" },
    # D119: proc-macro-error comes with the GTK3 bindings (glib-macros) of Tauri's Linux webview.
    # Compile-time only, Linux only; Tauri 2 has no GTK4 port to move to.
    { id = "RUSTSEC-2024-0370", reason = "compile-time proc-macro of Tauri's Linux GTK3 stack, no runtime code (D119)" },
]

[licenses]
# Permissive licences only (TERV.md 1.1). Anything else fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this private workspace carry no version; that is intended.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
