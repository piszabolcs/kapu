[package]
name = "kapu-cli"
description = "Command-line tool for KAPU files (spec chapter 8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "kapu"
path = "src/main.rs"

[dependencies]
kapu-core = { path = "../kapu-core" }
clap = { version = "4", features = ["derive", "string"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
