[package]
name = "kapu-mcp"
description = "MCP server (stdio) exposing KAPU files to AI agents (FR-15)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "kapu-mcp"
path = "src/main.rs"

[dependencies]
kapu-core = { path = "../kapu-core" }
# D54: stdio server only; no HTTP client, no OAuth (no network, spec 7.5).
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "3.7", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
kapu-core = { path = "../kapu-core" }
serde_json = "1"
