[package]
name = "kapu-core"
description = "Reader, validator, builder and search engine for the KAPU single-file knowledge container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
rust-stemmers = "1.2"
tiktoken-rs = "0.12"
unicode-normalization = "0.1"
serde_json = "1"
# NFR-02: pure-Rust logarithm, the same bits on every platform (D105).
libm = "0.2"
# D29: no network (no `http`), no C regex (`onig`): pure-Rust fancy-regex.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
# NFR-02: pure-Rust logarithm, the same bits on every platform (D105).
libm = "0.2"
